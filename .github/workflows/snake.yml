
name: Contribution Snake

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: haruhiro907
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push SVG files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output/*.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update snake SVG" && git push origin HEAD:output)
